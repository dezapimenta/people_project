<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projeto CoE People — Gestão de Projetos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

:root {
  --bg-deep: #060d24;
  --bg-1: #0a1129;
  --bg-2: #0e1738;
  --card-bg: rgba(20, 32, 70, 0.55);
  --card-bg-strong: rgba(28, 42, 84, 0.75);
  --card-border: rgba(120, 180, 255, 0.12);
  --card-border-hover: rgba(0, 240, 220, 0.4);
  --ink-1: #ffffff;
  --ink-2: #c9d4e8;
  --ink-3: #8a99b8;
  --ink-4: #5d6e90;
  --neon-cyan: #00f0d4;
  --neon-cyan-soft: rgba(0, 240, 220, 0.15);
  --neon-blue: #4ba3ff;
  --neon-blue-soft: rgba(75, 163, 255, 0.15);
  --neon-lime: #b4ff3c;
  --neon-pink: #ff5fa0;
  --neon-orange: #ffa94d;
  --space-4: 8px;
  --space-6: 12px;
  --space-8: 16px;
  --r-lg: 10px;
  --r-md: 8px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 11px;
  line-height: 1.5;
  color: var(--ink-1);
  background:
    radial-gradient(ellipse at top left, rgba(75, 163, 255, 0.12), transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(0, 240, 220, 0.08), transparent 50%),
    var(--bg-deep);
  background-attachment: fixed;
  min-height: 100vh;
}

.layout {
  display: flex;
  min-height: 100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 180px;
  background: rgba(6, 13, 36, 0.85);
  backdrop-filter: blur(12px);
  border-right: 1px solid var(--card-border);
  padding: var(--space-6);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.sidebar-logo {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-1);
  letter-spacing: 0.02em;
  padding-bottom: var(--space-4);
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-logo-icon {
  width: 22px;
  height: 22px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--bg-deep);
}

.sidebar-section { display: flex; flex-direction: column; gap: 2px; }

.sidebar-title {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 8px;
  letter-spacing: 0.08em;
}

.sidebar-item {
  padding: 6px 9px;
  border-radius: var(--r-md);
  cursor: pointer;
  font-size: 11px;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.2s ease;
  border: 1px solid transparent;
}

.sidebar-item:hover {
  background: var(--neon-blue-soft);
  color: var(--neon-blue);
}

.sidebar-item.active {
  background: var(--neon-blue-soft);
  color: var(--neon-blue);
  border-color: rgba(75, 163, 255, 0.3);
  font-weight: 600;
}

.sidebar-icon { font-size: 16px; }

/* ===== MAIN AREA ===== */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.header {
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--card-border);
  background: rgba(10, 17, 41, 0.6);
  backdrop-filter: blur(12px);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h1 {
  margin: 0;
  font-size: 15px;
  color: var(--ink-1);
  font-weight: 700;
}

.header-right {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  color: var(--ink-3);
  font-size: 13px;
}

.content-area {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6);
}

/* ===== BUTTONS ===== */
.btn {
  padding: 5px 10px;
  border: 1px solid transparent;
  border-radius: var(--r-md);
  font-weight: 600;
  font-size: 10px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
  color: var(--bg-deep);
  font-weight: 700;
}

.btn-primary:hover {
  box-shadow: 0 0 20px rgba(0, 240, 220, 0.4);
  transform: translateY(-1px);
}

.btn-secondary {
  background: var(--card-bg);
  color: var(--ink-2);
  border-color: var(--card-border);
}

.btn-secondary:hover {
  background: var(--card-bg-strong);
  color: var(--ink-1);
  border-color: var(--neon-cyan);
}

/* ===== CARDS ===== */
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--space-6);
  backdrop-filter: blur(12px);
  transition: all 0.2s ease;
}

.card:hover {
  border-color: var(--card-border-hover);
  background: var(--card-bg-strong);
}

/* ===== STATS ===== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-6);
  margin-bottom: var(--space-8);
}

.stat-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--space-4);
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
  opacity: 0.6;
}

.stat-label {
  font-size: 9px;
  color: var(--ink-3);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
}

.stat-value {
  font-size: 19px;
  font-weight: 700;
  color: var(--neon-cyan);
  line-height: 1;
}

/* ===== FILTERS ===== */
.filters {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
  margin-bottom: var(--space-4);
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--space-4);
  backdrop-filter: blur(12px);
}

.filter-group label {
  display: block;
  font-size: 9px;
  font-weight: 600;
  color: var(--ink-3);
  margin-bottom: 3px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.filter-group input,
.filter-group select {
  width: 100%;
  padding: 5px 8px;
  background: rgba(6, 13, 36, 0.6);
  border: 1px solid var(--card-border);
  border-radius: var(--r-md);
  font-size: 11px;
  font-family: inherit;
  color: var(--ink-1);
}

.filter-group input::placeholder { color: var(--ink-4); }

.filter-group input:focus,
.filter-group select:focus {
  outline: none;
  border-color: var(--neon-cyan);
  box-shadow: 0 0 0 3px rgba(0, 240, 220, 0.15);
}

.filter-group select option { background: var(--bg-1); color: var(--ink-1); }

/* ===== PROJECTS GRID ===== */
.projects-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--space-4);
}

.project-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--space-4);
  backdrop-filter: blur(12px);
  transition: all 0.2s ease;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.project-card:hover {
  border-color: var(--card-border-hover);
  background: var(--card-bg-strong);
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(0, 240, 220, 0.12);
}

.project-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: var(--space-4);
}

.project-icon { font-size: 18px; }

.project-status {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 8px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border: 1px solid transparent;
}

.project-status.progress { background: rgba(0, 240, 220, 0.12); color: var(--neon-cyan); border-color: rgba(0, 240, 220, 0.3); }
.project-status.discovery { background: rgba(180, 130, 255, 0.12); color: #c8a4ff; border-color: rgba(180, 130, 255, 0.3); }
.project-status.planning { background: rgba(255, 169, 77, 0.12); color: var(--neon-orange); border-color: rgba(255, 169, 77, 0.3); }

.project-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-1);
  margin: 0 0 3px 0;
}

.project-subtitle {
  font-size: 10px;
  color: var(--ink-3);
  margin: 0 0 var(--space-4) 0;
  line-height: 1.35;
}

.progress-section { margin: var(--space-4) 0; }

.progress-header {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  margin-bottom: 5px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.progress-header strong { color: var(--neon-cyan); font-weight: 700; }

.progress-bar {
  height: 6px;
  background: rgba(6, 13, 36, 0.6);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
  transition: width 0.3s ease;
  box-shadow: 0 0 8px rgba(0, 240, 220, 0.5);
}

.project-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: var(--space-4);
  border-top: 1px solid var(--card-border);
  margin-top: var(--space-4);
}

.project-owner { display: flex; align-items: center; gap: 10px; }

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: white;
  border: 2px solid rgba(255, 255, 255, 0.15);
  flex-shrink: 0;
}
.avatar-photo {
  border: 2px solid var(--neon-cyan);
  box-shadow: 0 0 0 1px rgba(0, 240, 220, 0.3), 0 0 12px rgba(0, 240, 220, 0.2);
}

.owner-info { font-size: 12px; }
.owner-name { font-weight: 600; color: var(--ink-2); }
.owner-due { font-size: 11px; color: var(--ink-4); margin-top: 1px; }

.project-actions { display: flex; gap: 6px; }

.action-btn {
  width: 30px; height: 30px;
  border: 1px solid var(--card-border);
  border-radius: 50%;
  background: rgba(6, 13, 36, 0.6);
  color: var(--ink-3);
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.action-btn:hover {
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
}

/* ===== MODAL ===== */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal.active { display: flex; }

.modal-content {
  background: var(--bg-1);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--space-8);
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 240, 220, 0.1);
}

.modal-header {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: var(--space-6);
  color: var(--ink-1);
}

.modal-close {
  position: absolute;
  top: var(--space-6);
  right: var(--space-6);
  width: 32px; height: 32px;
  border: 1px solid var(--card-border);
  background: rgba(6, 13, 36, 0.6);
  color: var(--ink-3);
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
}

.modal-close:hover { color: var(--neon-cyan); border-color: var(--neon-cyan); }

.form-group { margin-bottom: var(--space-4); }

.form-group label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 10px 12px;
  background: rgba(6, 13, 36, 0.6);
  border: 1px solid var(--card-border);
  border-radius: var(--r-md);
  font-size: 14px;
  font-family: inherit;
  color: var(--ink-1);
}

.form-group textarea { resize: vertical; min-height: 90px; }
.form-group select option { background: var(--bg-1); }

.modal-footer {
  display: flex;
  gap: var(--space-4);
  margin-top: var(--space-6);
  justify-content: flex-end;
}

/* ===== BACKLOG ===== */
.backlog-list {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  backdrop-filter: blur(12px);
  overflow: hidden;
}

.backlog-row {
  display: grid;
  grid-template-columns: 1fr 120px;
  gap: var(--space-4);
  align-items: center;
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--card-border);
  transition: background 0.2s ease;
}

.backlog-row:last-child { border-bottom: none; }
.backlog-row:hover { background: rgba(75, 163, 255, 0.06); }

.backlog-title { font-weight: 600; color: var(--ink-1); margin-bottom: 2px; }
.backlog-project { font-size: 12px; color: var(--ink-3); }

.priority-badge {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  text-align: center;
  border: 1px solid transparent;
}

.priority-high { background: rgba(255, 95, 160, 0.12); color: var(--neon-pink); border-color: rgba(255, 95, 160, 0.3); }
.priority-medium { background: rgba(255, 169, 77, 0.12); color: var(--neon-orange); border-color: rgba(255, 169, 77, 0.3); }
.priority-low { background: rgba(140, 160, 200, 0.12); color: var(--ink-3); border-color: rgba(140, 160, 200, 0.3); }

/* ===== TIMELINE ===== */
.timeline-container {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--space-8) var(--space-6);
  backdrop-filter: blur(12px);
  overflow-x: auto;
}

@media (max-width: 1024px) {
  .sidebar { width: 220px; }
  .filters { grid-template-columns: 1fr; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0, 240, 220, 0.3); }
</style>
</head>
<body>
<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">⚡</div>
      <div>Projeto CoE<br><span style="font-size: 11px; color: var(--neon-cyan); font-weight: 500;">PEOPLE</span></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Navegação</div>
      <div class="sidebar-item active" data-tab="projetos"><span class="sidebar-icon">▦</span> Dashboard</div>
      <div class="sidebar-item" data-tab="timeline"><span class="sidebar-icon">⊟</span> Timeline</div>
      <div class="sidebar-item" data-tab="backlog"><span class="sidebar-icon">≡</span> Backlog</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Ações</div>
      <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-bottom: 8px;" onclick="openNewProjectModal()">+ Novo Projeto</button>
      <button class="btn btn-secondary" style="width: 100%; justify-content: center;" onclick="exportCSV()">↓ Exportar CSV</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-area">
    <div class="header">
      <h1 id="page-title">Dashboard</h1>
      <div class="header-right">
        <span><strong id="project-count" style="color: var(--neon-cyan);">0</strong> projetos</span>
        <div style="display: flex; align-items: center; gap: 10px; padding-left: 16px; border-left: 1px solid var(--card-border);">
          <div class="avatar avatar-photo" style="background-image: url('assets/team/andreza_pimenta.png'); background-size: cover; background-position: center;" title="Andreza Pimenta"></div>
          <div style="line-height: 1.2;">
            <div style="font-size: 13px; font-weight: 700; color: var(--ink-1);">Andreza Pimenta</div>
            <div style="font-size: 10px; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;">Group PM</div>
          </div>
        </div>
      </div>
    </div>

    <div class="content-area">
      <!-- DASHBOARD -->
      <div id="tab-projetos" class="tab-content">
        <div class="stats" id="stats-container"></div>

        <div style="margin-bottom: var(--space-6);">
          <div style="font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-bottom: 8px;">Relatórios</div>
          <div id="reports-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4);"></div>
        </div>

        <div class="filters">
          <div class="filter-group">
            <label>Ordenar por data</label>
            <select id="filter-date">
              <option value="start-asc">Início (mais antigo)</option>
              <option value="start-desc">Início (mais recente)</option>
              <option value="end-asc">Fim (mais antigo)</option>
              <option value="end-desc">Fim (mais recente)</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Etapa</label>
            <select id="filter-status">
              <option value="">Todas</option>
              <option value="Desenvolvimento">Desenvolvimento</option>
              <option value="Teste internos">Teste internos</option>
              <option value="Go-to-Market: New Wave 1">Go-to-Market: New Wave 1</option>
              <option value="Go-to-Market: New Wave 2">Go-to-Market: New Wave 2</option>
            </select>
          </div>
        </div>

        <div class="projects-container" id="projects-grid"></div>
      </div>

      <!-- TIMELINE -->
      <div id="tab-timeline" class="tab-content" style="display: none;">
        <div style="display: flex; gap: var(--space-4); margin-bottom: var(--space-4); flex-wrap: wrap; align-items: end;">
          <div class="filter-group" style="min-width: 200px;">
            <label>Etapa</label>
            <select id="timeline-filter-stage">
              <option value="">Todas</option>
              <option value="Desenvolvimento">Desenvolvimento</option>
              <option value="Teste internos">Teste internos</option>
              <option value="Go-to-Market: New Wave 1">Go-to-Market: New Wave 1</option>
              <option value="Go-to-Market: New Wave 2">Go-to-Market: New Wave 2</option>
            </select>
          </div>
        </div>
        <div class="timeline-container">
          <div id="timeline-container-inner" style="min-width: 570px;"></div>
        </div>
      </div>

      <!-- BACKLOG -->
      <div id="tab-backlog" class="tab-content" style="display: none;">
        <div class="backlog-list" id="backlog-list"></div>
      </div>

      <!-- RELATÓRIOS removido — integrado ao Dashboard -->
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="project-modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-header" id="modal-title">Novo Projeto</div>
    <form id="project-form">
      <div class="form-group"><label>Nome</label><input type="text" id="form-name" required></div>
      <div class="form-group"><label>Descrição</label><textarea id="form-sub" required></textarea></div>
      <div class="form-group"><label>Status</label>
        <select id="form-status" required>
          <option value="progress">Em andamento</option>
          <option value="discovery">Discovery</option>
          <option value="planning">Planejamento</option>
        </select>
      </div>
      <div class="form-group"><label>Etapa</label>
        <select id="form-category" required>
          <option value="Desenvolvimento">Desenvolvimento</option>
          <option value="Teste internos">Teste internos</option>
          <option value="Go-to-Market: New Wave 1">Go-to-Market: New Wave 1</option>
          <option value="Go-to-Market: New Wave 2">Go-to-Market: New Wave 2</option>
        </select>
      </div>
      <div class="form-group"><label>Progresso (%)</label><input type="number" id="form-progress" min="0" max="100" value="0" required></div>
      <div class="form-group"><label>Owner</label><select id="form-owner" required></select></div>
      <div class="form-group"><label>Prazo</label><input type="text" id="form-due" placeholder="ex: 12 jun" required></div>

function dueToPos(due) {
  if (!due) return 0;
  const months = { abr: 0, mai: 1, jun: 2, jul: 3, ago: 4, set: 5, out: 6 };
  const [day, monthStr] = due.toLowerCase().split(' ');
  const month = months[monthStr] ?? 0;
  return month + (parseInt(day) || 1) / 30;
}

function renderTimeline(filtered = PROJECTS) {
  const container = document.getElementById('timeline-container-inner');
  const TOTAL_MONTHS = 6;
  const MONTH_WIDTH = 75;
  const TIMELINE_WIDTH = TOTAL_MONTHS * MONTH_WIDTH;
  const LABEL_WIDTH = 220;
  const MONTHS = ['Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set'];
  const TODAY_POS = 1.87;

  const QUARTERS = [
    { label: 'Q2', start: 0, end: 3, color: 'linear-gradient(90deg, #008fff, #00fff2)' },
    { label: 'Q3', start: 3, end: 6, color: 'linear-gradient(90deg, #00fff2, #b4ff3c)' },
  ];

  // Sort by start date
  const sorted = [...filtered].sort((a, b) => a.start - b.start);

  let html = `<div style="position: relative;">`;

  // Legend at TOP
  html += `<div style="display: flex; gap: 12px; margin-bottom: 10px; padding: 8px 10px; background: rgba(6, 13, 36, 0.4); border: 1px solid var(--card-border); border-radius: 6px; flex-wrap: wrap;">
    <div style="font-size: 9px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; align-self: center;">Etapas:</div>`;
  Object.entries(CATEGORY_COLORS).forEach(([cat, color]) => {
    html += `<div style="display: flex; align-items: center; gap: 5px; font-size: 9px; color: var(--ink-2); font-weight: 600;">
      <div style="width: 12px; height: 12px; background: ${color}; border-radius: 2px;"></div>${cat}
    </div>`;
  });
  html += `</div>`;

  // Quarters bar
  html += `<div style="display: flex; align-items: center; margin-bottom: 2px;">
    <div style="width: ${LABEL_WIDTH}px;"></div>
    <div style="display: flex; width: ${TIMELINE_WIDTH}px; height: 18px; border-radius: 4px; overflow: hidden;">`;
  QUARTERS.forEach(q => {
    const width = (q.end - q.start) * MONTH_WIDTH;
    html += `<div style="width: ${width}px; background: ${q.color}; display: flex; align-items: center; justify-content: center; color: #171e3d; font-weight: 700; font-size: 9px;">${q.label}</div>`;
  });
  html += `</div></div>`;

  // Month labels
  html += `<div style="display: flex; align-items: center; margin-bottom: 8px;">
    <div style="width: ${LABEL_WIDTH}px;"></div>
    <div style="display: flex; width: ${TIMELINE_WIDTH}px;">`;
  MONTHS.forEach(month => {
    html += `<div style="width: ${MONTH_WIDTH}px; text-align: center; font-size: 8px; color: var(--ink-3); font-weight: 600; padding: 1px 0;">${month}</div>`;
  });
  html += `</div></div>`;

  // Today line
  const todayLeft = LABEL_WIDTH + TODAY_POS * MONTH_WIDTH;
  html += `
    <div style="position: absolute; left: ${todayLeft}px; top: 0; bottom: 0; width: 1.5px; background: #00fff2; z-index: 5; box-shadow: 0 0 8px rgba(0,255,242,0.6);">
      <div style="position: absolute; top: 24px; left: 50%; transform: translateX(-50%); background: #00fff2; color: #171e3d; padding: 1px 5px; border-radius: 2px; font-size: 8px; font-weight: 700; white-space: nowrap;">Hoje</div>
    </div>
  `;

  // All projects (no grouping)
  sorted.forEach(p => {
    const catColor = CATEGORY_COLORS[p.category];
    const textColor = CATEGORY_TEXT[p.category] || '#171e3d';
    const left = p.start * MONTH_WIDTH;
    const width = Math.max((p.end - p.start) * MONTH_WIDTH, 80);

    const stack = [p.owner, p.coOwner, p.hrbp].filter(Boolean).map((person, i) => {
      const photoStyle = person.photo
        ? `background-image: url('${person.photo}'); background-size: cover; background-position: center;`
        : `background: ${person.color}; color: #171e3d; display: flex; align-items: center; justify-content: center; font-size: 6px; font-weight: 700;`;
      const initials = person.photo ? '' : person.initials;
      return `<div style="width: 16px; height: 16px; border-radius: 50%; ${photoStyle} border: 1.5px solid var(--bg-1); margin-left: ${i === 0 ? 0 : -5}px; flex-shrink: 0;" title="${person.name}">${initials}</div>`;
    }).join('');

    const chipBg = textColor === '#ffffff' ? 'rgba(255, 255, 255, 0.2)' : 'rgba(23, 30, 61, 0.25)';

    html += `
      <div style="display: flex; align-items: center; margin-bottom: 14px;">
        <div style="width: ${LABEL_WIDTH}px; padding-right: 8px; font-size: 10px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 6px;" title="${p.name}">
          <img src="${p.iface}" style="width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0; object-fit: contain;" alt="" />
          <span>${p.name}</span>
        </div>
        <div style="position: relative; width: ${TIMELINE_WIDTH}px; height: 30px;">
          <div style="position: absolute; left: ${left}px; width: ${width}px; height: 22px; top: 0; background: ${catColor}; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 3px; color: ${textColor}; font-size: 9px; font-weight: 700; box-shadow: 0 1px 5px ${catColor}50; overflow: hidden;">
            <div style="display: flex; align-items: center; flex-shrink: 0;">${stack}</div>
            <span style="background: ${chipBg}; padding: 0 4px; border-radius: 2px; font-size: 8px; font-weight: 700; flex-shrink: 0;">${p.progress}%</span>
          </div>
          <div style="position: absolute; left: ${left}px; top: 23px; font-size: 7px; color: var(--ink-3); white-space: nowrap; font-weight: 500;">${p.startStr}</div>
          <div style="position: absolute; left: ${left + width}px; top: 23px; transform: translateX(-100%); font-size: 7px; color: var(--ink-3); white-space: nowrap; font-weight: 500;">${p.endStr}</div>
        </div>
      </div>
    `;
  });

  html += `</div>`;
  container.innerHTML = html;
}

}

function deleteProject(id) {
  if (!confirm('Deletar este projeto?')) return;
  PROJECTS = PROJECTS.filter(p => p.id !== id);
  applyFilters();
  renderStats();
  renderReports();
}

document.getElementById('project-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const ownerId = document.getElementById('form-owner').value;
  const owner = Object.values(TEAM).find(t => t.id === ownerId);
  if (editingId) {
    const p = PROJECTS.find(p => p.id === editingId);
    p.name = document.getElementById('form-name').value;
    p.sub = document.getElementById('form-sub').value;
    p.status = document.getElementById('form-status').value;
    p.category = document.getElementById('form-category').value;
    p.progress = parseInt(document.getElementById('form-progress').value);
    p.owner = owner;
    p.due = document.getElementById('form-due').value;
  } else {
    PROJECTS.push({
      id: 'p' + Date.now(),
      name: document.getElementById('form-name').value,
      sub: document.getElementById('form-sub').value,
      icon: '📌',
      status: document.getElementById('form-status').value,
      category: document.getElementById('form-category').value,
      progress: parseInt(document.getElementById('form-progress').value),
      owner: owner,
      due: document.getElementById('form-due').value,
      start: 0, end: 1,
    });
  }
  closeModal();
  applyFilters();
  renderStats();
  renderReports();
});

function applyFilters() {
  const stageFilter = document.getElementById('filter-status').value;
  const dateSort = document.getElementById('filter-date').value;
  let filtered = PROJECTS.filter(p => !stageFilter || p.category === stageFilter);
  if (dateSort === 'start-asc') filtered.sort((a, b) => a.start - b.start);
  else if (dateSort === 'start-desc') filtered.sort((a, b) => b.start - a.start);
  else if (dateSort === 'end-asc') filtered.sort((a, b) => a.end - b.end);
  else if (dateSort === 'end-desc') filtered.sort((a, b) => b.end - a.end);
  renderProjects(filtered);
  renderTimeline(filtered);
}

function exportCSV() {
  const headers = ['Projeto', 'Categoria', 'Status', 'Progresso', 'Owner', 'Prazo'];
  const rows = PROJECTS.map(p => [p.name, p.category, STATUS_LABEL[p.status], `${p.progress}%`, p.owner.name, p.due]);
  let csv = headers.join(',') + '\n';
  rows.forEach(row => csv += row.map(c => `"${c}"`).join(',') + '\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `CoE_Projetos_${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a);
  a.click();
  URL.revokeObjectURL(url);
  document.body.removeChild(a);
}

document.querySelectorAll('.sidebar-item').forEach(item => {
  item.addEventListener('click', () => {
    const tabName = item.dataset.tab;
    const tabMap = { projetos: 'tab-projetos', timeline: 'tab-timeline', backlog: 'tab-backlog' };
    const titleMap = { projetos: 'Dashboard', timeline: 'Timeline', backlog: 'Backlog' };
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    document.getElementById(tabMap[tabName]).style.display = 'block';
    item.classList.add('active');
    document.getElementById('page-title').textContent = titleMap[tabName];
  });
});

Object.values(TEAM).forEach(owner => {
  const o2 = document.createElement('option');
  o2.value = owner.id; o2.textContent = owner.name;
  document.getElementById('form-owner').appendChild(o2);
});

document.getElementById('filter-date').addEventListener('change', applyFilters);
document.getElementById('filter-status').addEventListener('change', applyFilters);
document.getElementById('timeline-filter-stage').addEventListener('change', applyTimelineFilters);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

renderProjects();
renderStats();
renderTimeline();
renderBacklog();
renderReports();
</script>
</body>
</html>
