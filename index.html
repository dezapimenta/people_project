<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projeto CoE People — Gestão de Projetos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

:root {
  --bg-deep: #060d24;
  --bg-1: #0a1129;
  --bg-2: #0e1738;
  --card-bg: rgba(20, 32, 70, 0.55);
  --card-bg-strong: rgba(28, 42, 84, 0.75);
  --card-border: rgba(120, 180, 255, 0.12);
  --card-border-hover: rgba(0, 240, 220, 0.4);
  --ink-1: #ffffff;
  --ink-2: #c9d4e8;
  --ink-3: #8a99b8;
  --ink-4: #5d6e90;
  --neon-cyan: #00f0d4;
  --neon-cyan-soft: rgba(0, 240, 220, 0.15);
  --neon-blue: #4ba3ff;
  --neon-blue-soft: rgba(75, 163, 255, 0.15);
  --neon-lime: #b4ff3c;
  --neon-pink: #ff5fa0;
  --neon-orange: #ffa94d;
  --space-4: 8px;
  --space-6: 12px;
  --space-8: 16px;
  --r-lg: 10px;
  --r-md: 8px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 11px;
  line-height: 1.5;
  color: var(--ink-1);
  background:
    radial-gradient(ellipse at top left, rgba(75, 163, 255, 0.12), transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(0, 240, 220, 0.08), transparent 50%),
    var(--bg-deep);
  background-attachment: fixed;
  min-height: 100vh;
}

.app-container {
  display: flex;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

.main-content {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.content-area {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-6);
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 180px;
  background: rgba(6, 13, 36, 0.85);
  backdrop-filter: blur(12px);
  border-right: 1px solid var(--card-border);
  padding: var(--space-6);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.sidebar-logo {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-1);
  letter-spacing: 0.02em;
  padding-bottom: var(--space-4);
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-logo-icon {
  width: 22px;
  height: 22px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--bg-deep);
}

.sidebar-section { display: flex; flex-direction: column; gap: 2px; }

.sidebar-title {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 8px;
  letter-spacing: 0.08em;
}

.sidebar-item {
  padding: 6px 9px;
  border-radius: var(--r-md);
  cursor: pointer;
  font-size: 11px;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.2s ease;
  border: 1px solid transparent;
}

.sidebar-item:hover {
  background: var(--neon-blue-soft);
  color: var(--neon-blue);
}

.sidebar-item.active {
  background: var(--neon-blue-soft);
  color: var(--neon-blue);
  border-color: rgba(75, 163, 255, 0.3);
  font-weight: 600;
}

.sidebar-icon { font-size: 16px; }

.header {
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--card-border);
  background: rgba(10, 17, 41, 0.6);
  backdrop-filter: blur(12px);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h1 {
  margin: 0;
  font-size: 15px;
  color: var(--ink-1);
  font-weight: 700;
}

.header-right {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  color: var(--ink-3);
  font-size: 13px;
}

/* ===== BUTTONS ===== */
.btn {
  padding: 5px 10px;
  border: 1px solid transparent;
  border-radius: var(--r-md);
  font-weight: 600;
  font-size: 10px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
  color: var(--bg-deep);
  font-weight: 700;
}

.btn-primary:hover {
  box-shadow: 0 0 20px rgba(0, 240, 220, 0.4);
  transform: translateY(-1px);
}

.btn-secondary {
  background: var(--card-bg);
  color: var(--ink-2);
  border-color: var(--card-border);
}

.btn-secondary:hover {
  background: var(--card-bg-strong);
  color: var(--ink-1);
  border-color: var(--neon-cyan);
}

.timeline-sort-btn {
  background: rgba(20, 32, 70, 0.5);
  border: 1px solid var(--card-border);
  color: var(--ink-2);
  padding: 4px var(--space-4);
  border-radius: var(--r-md);
  cursor: pointer;
  font-size: 10px;
  font-weight: 600;
  transition: all 0.2s ease;
}

.timeline-sort-btn:hover, .timeline-sort-btn.active {
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  background: rgba(0, 240, 220, 0.05);
}

.action-btn {
  background: none;
  border: none;
  color: var(--ink-3);
  cursor: pointer;
  font-size: 11px;
  transition: color 0.2s;
  padding: 2px var(--space-4);
}
.action-btn:hover { color: var(--neon-cyan); }

/* ===== SWITCH TOGGLE ===== */
.view-toggle-container {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  padding-left: 12px;
  border-left: 1px solid var(--card-border);
}

.toggle-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  transition: color 0.2s;
  color: var(--ink-4);
}

.toggle-label.active {
  color: var(--neon-cyan);
}

.toggle-switch {
  width: 44px;
  height: 22px;
  background: rgba(20, 32, 70, 0.7);
  border: 1px solid rgba(120, 180, 255, 0.2);
  border-radius: 999px;
  position: relative;
  transition: border-color 0.2s;
}

.toggle-switch::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  left: 2px;
  top: 2px;
  background: #ffffff;
  border-radius: 50%;
  transition: transform 0.2s, background 0.2s;
}

.view-toggle-container.kpi-active .toggle-switch {
  border-color: var(--neon-blue);
}

.view-toggle-container.kpi-active .toggle-switch::after {
  transform: translateX(22px);
  background: var(--neon-blue);
}

/* ===== CARDS ===== */
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--space-6);
  backdrop-filter: blur(12px);
  transition: all 0.2s ease;
}

.card:hover {
  border-color: var(--card-border-hover);
  background: var(--card-bg-strong);
}

/* ===== STATS ===== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--space-6);
  margin-bottom: var(--space-8);
}

.stat-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--space-6) var(--space-4);
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}

.stat-label {
  font-size: 9px;
  color: var(--ink-3);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
}

.stat-value {
  font-size: 19px;
  font-weight: 700;
  color: var(--neon-cyan);
  line-height: 1;
}

/* ===== FILTERS ===== */
.filters {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
  margin-bottom: var(--space-4);
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--space-4);
  backdrop-filter: blur(12px);
}

.filter-group label {
  display: block;
  font-size: 9px;
  font-weight: 600;
  color: var(--ink-3);
  margin-bottom: 3px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.filter-group input,
.filter-group select {
  width: 100%;
  padding: 5px 8px;
  background: rgba(6, 13, 36, 0.6);
  border: 1px solid var(--card-border);
  border-radius: var(--r-md);
  font-size: 11px;
  font-family: inherit;
  color: var(--ink-1);
}

.filter-group select option { background: var(--bg-1); color: var(--ink-1); }

/* ===== PROJECTS GRID ===== */
.projects-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--space-4);
}

.project-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--space-4);
  backdrop-filter: blur(12px);
  transition: all 0.2s ease;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.project-card:hover {
  border-color: var(--card-border-hover);
  background: var(--card-bg-strong);
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(0, 240, 220, 0.12);
}

.project-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: var(--space-4);
}

.project-status {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 999px;
  font-size: 8px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border: 1px solid transparent;
}

.project-status.progress { background: rgba(0, 240, 220, 0.12); color: var(--neon-cyan); border-color: rgba(0, 240, 220, 0.3); }
.project-status.discovery { background: rgba(180, 130, 255, 0.12); color: #c8a4ff; border-color: rgba(180, 130, 255, 0.3); }
.project-status.planning { background: rgba(255, 169, 77, 0.12); color: var(--neon-orange); border-color: rgba(255, 169, 77, 0.3); }

.project-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-1);
  margin: 0 0 3px 0;
}

.project-subtitle {
  font-size: 10px;
  color: var(--ink-3);
  margin: 0 0 var(--space-4) 0;
  line-height: 1.35;
}

.progress-section { margin: var(--space-4) 0; }

.progress-header {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  margin-bottom: 5px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.progress-header strong { color: var(--neon-cyan); font-weight: 700; }

.progress-bar {
  height: 6px;
  background: rgba(6, 13, 36, 0.6);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
  transition: width 0.3s ease;
  box-shadow: 0 0 8px rgba(0, 240, 220, 0.5);
}

/* ===== MODAL ===== */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal.active { display: flex; }

.modal-content {
  background: var(--bg-1);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--space-8);
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 240, 220, 0.1);
}

.modal-header {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: var(--space-6);
  color: var(--ink-1);
}

.modal-close {
  position: absolute;
  top: var(--space-6);
  right: var(--space-6);
  width: 32px; height: 32px;
  border: 1px solid var(--card-border);
  background: rgba(6, 13, 36, 0.6);
  color: var(--ink-3);
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
}

.modal-close:hover { color: var(--neon-cyan); border-color: var(--neon-cyan); }

.form-group { margin-bottom: var(--space-4); }

.form-group label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 10px 12px;
  background: rgba(6, 13, 36, 0.6);
  border: 1px solid var(--card-border);
  border-radius: var(--r-md);
  font-size: 14px;
  font-family: inherit;
  color: var(--ink-1);
}

.form-group textarea { resize: vertical; min-height: 90px; }
.form-group select option { background: var(--bg-1); }

.modal-footer {
  display: flex;
  gap: var(--space-4);
  margin-top: var(--space-6);
  justify-content: flex-end;
}

/* ===== BACKLOG ===== */
.backlog-list {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  backdrop-filter: blur(12px);
  overflow: hidden;
}

.backlog-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--card-border);
  transition: background 0.2s ease;
}

.backlog-row:last-child { border-bottom: none; }
.backlog-row:hover { background: rgba(75, 163, 255, 0.06); }

.backlog-title { font-weight: 600; color: var(--ink-1); margin-bottom: 2px; }
.backlog-project { font-size: 12px; color: var(--ink-3); }

.priority-badge {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  text-align: center;
  border: 1px solid transparent;
}

.priority-high { background: rgba(255, 95, 160, 0.12); color: var(--neon-pink); border-color: rgba(255, 95, 160, 0.3); }
.priority-medium { background: rgba(255, 169, 77, 0.12); color: var(--neon-orange); border-color: rgba(255, 169, 77, 0.3); }
.priority-low { background: rgba(140, 160, 200, 0.12); color: var(--ink-3); border-color: rgba(140, 160, 200, 0.3); }

.status-badge {
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border: 1px solid transparent;
}

.status-todo { background: rgba(140, 160, 200, 0.12); color: var(--ink-3); border-color: rgba(140, 160, 200, 0.3); }
.status-in-progress { background: rgba(255, 169, 77, 0.12); color: var(--neon-orange); border-color: rgba(255, 169, 77, 0.3); }
.status-done { background: rgba(75, 163, 255, 0.12); color: var(--neon-blue); border-color: rgba(75, 163, 255, 0.3); }

/* ===== TIMELINE ===== */
.timeline-container {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--r-lg);
  padding: var(--space-8) var(--space-6);
  backdrop-filter: blur(12px);
  overflow-x: auto;
}

@media (max-width: 1024px) {
  .sidebar { width: 140px; }
  .filters { grid-template-columns: 1fr; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0, 240, 220, 0.3); }
</style>
</head>
<body>
<div class="app-container">
  
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">⚡</div>
      <div>Projeto CoE<br><span style="font-size: 11px; color: var(--neon-cyan); font-weight: 500;">PEOPLE</span></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Navegação</div>
      <div class="sidebar-item active" data-tab="projetos"><span class="sidebar-icon">▦</span> Dashboard</div>
      <div class="sidebar-item" data-tab="timeline"><span class="sidebar-icon">⊟</span> Timeline</div>
      <div class="sidebar-item" data-tab="backlog"><span class="sidebar-icon">≡</span> Backlog</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Ações</div>
      <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-bottom: 8px;" onclick="openNewProjectModal()">+ Novo Projeto</button>
    </div>
  </div>

  <div class="main-content">
    <div class="header">
      <h1 id="page-title">Dashboard</h1>
      <div class="header-right">
        <span><strong id="project-count" style="color: var(--neon-cyan);">0</strong> projetos</span>
        <div style="display: flex; align-items: center; gap: 10px; padding-left: 12px; border-left: 1px solid var(--card-border);">
          <div class="avatar avatar-photo" style="background-image: url('assets/team/andreza_pimenta.png'); background-size: cover; background-position: center;" title="Andreza Pimenta"></div>
          <div style="line-height: 1.2;">
            <div style="font-size: 13px; font-weight: 700; color: var(--ink-1);">Andreza Pimenta</div>
            <div style="font-size: 10px; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;">Group PM</div>
          </div>
        </div>
      </div>
    </div>

    <div class="content-area">
      
      <div id="tab-projetos" class="tab-content">
        <div class="stats" id="stats-container"></div>

        <div class="filters">
          <div class="filter-group">
            <label>Ordenar por</label>
            <select id="filter-date" onchange="applyDashboardFilters()">
              <option value="start-asc">Início (mais antigo)</option>
              <option value="start-desc">Início (mais recente)</option>
              <option value="end-asc">Fim (mais antigo)</option>
              <option value="end-desc">Fim (mais recente)</option>
              <option value="interface-asc">Interface / Infraestrutura (A-Z)</option>
              <option value="owner-asc">Owner (A-Z)</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Etapa Atual do Projeto</label>
            <select id="filter-status" onchange="applyDashboardFilters()">
              <option value="">Todas</option>
              <option value="Desenvolvimento">Desenvolvimento</option>
              <option value="Teste internos">Teste internos</option>
              <option value="Go-to-Market: New Wave 1">Go-to-Market: New Wave 1</option>
              <option value="Go-to-Market: New Wave 2">Go-to-Market: New Wave 2</option>
            </select>
          </div>
        </div>

        <div class="projects-container" id="projects-grid"></div>
      </div>

      <div id="tab-timeline" class="tab-content" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px 14px; border-radius: var(--r-lg); backdrop-filter: blur(12px); flex-wrap: wrap; gap: 10px;">
          <div style="display: flex; gap: 10px; align-items: center;">
            <span style="font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-right: var(--space-4);">Ordenar Linha:</span>
            <button class="timeline-sort-btn active" id="sort-timeline-start" onclick="sortTimeline('start')">Testes Internos</button>
            <button class="timeline-sort-btn" id="sort-timeline-owner" onclick="sortTimeline('owner')">Owner</button>
            <button class="timeline-sort-btn" id="sort-timeline-infra" onclick="sortTimeline('infra')">Interface</button>
            <button class="timeline-sort-btn" id="sort-timeline-impact" onclick="sortTimeline('impact')">Público Alvo</button>
          </div>
          
          <div class="view-toggle-container" id="timeline-toggle-switch" onclick="toggleTimelineView()">
            <span class="toggle-label active" id="lbl-view-timeline">Timeline</span>
            <div class="toggle-switch"></div>
            <span class="toggle-label" id="lbl-view-kpis">KPIs</span>
          </div>
        </div>

        <div class="timeline-container">
          <div id="timeline-container-inner" style="min-width: 570px;"></div>
        </div>
      </div>

      <div id="tab-backlog" class="tab-content" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6);">
          <h2 style="margin: 0; font-size: 16px; color: var(--ink-1); font-weight: 700;">Backlog Items</h2>
          <button class="btn btn-primary" onclick="openNewBacklogModal()" style="gap: 6px;">
            <span>➕</span> Novo Item
          </button>
        </div>
        <div class="backlog-list" id="backlog-list"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="project-modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-header" id="modal-title">Novo Projeto</div>
    <form id="project-form">

function dueToPos(due) {
  if (!due) return 0;
  const months = { abr: 0, mai: 1, jun: 2, jul: 3, ago: 4, set: 5 };
  const parts = due.toLowerCase().trim().split(/\s+/);
  if (parts.length < 2) return 0;
  const day = parseInt(parts[0]) || 1;
  const monthStr = parts[1].substring(0, 3);
  const monthIdx = months[monthStr] !== undefined ? months[monthStr] : 0;
  return monthIdx + (day / 30);
}

function generateTimelineAvatarHtml(person, size = 18) {
  if (!person || !person.photo || person.alwaysHide) return '';
  return `<img src="${person.photo}" alt="${person.name}" title="${person.name}" 
               style="width: ${size}px; height: ${size}px; border-radius: 50%; border: 1.5px solid var(--neon-cyan); object-fit: cover; box-shadow: 0 0 4px rgba(0,240,220,0.15);" 
               onerror="this.style.display='none';">`;
}

}

// ATUALIZADO: RETIRADA DA COLUNA TARGET E INTEGRAÇÃO DOS AVATARES COMPLETOS DE SQUAD (OWNER, COOWNER, HRBP)
function buildTimelineHTML(filtered) {
  if (currentActiveView === 'timeline') {
    const LABEL_WIDTH = 220; 
    const TOTAL_MONTHS = 6;
    const MONTH_WIDTH = 100; 
    const TIMELINE_WIDTH = TOTAL_MONTHS * MONTH_WIDTH;
    const MONTHS = ['Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set'];
    const TODAY_POS = 1.87;

    const QUARTERS = [
      { label: 'Q2', start: 0, end: 4, color: 'rgba(216, 216, 216, 0.1)' },
      { label: 'Q3', start: 4, end: 7, color: 'rgba(216, 216, 216, 0.1)' },
    ];

    let html = `<div style="position: relative;">`;

    html += `<div style="display: flex; gap: 16px; margin-bottom: 20px; padding: 10px 14px; background: rgba(10, 17, 41, 0.4); border: 1px solid var(--card-border); border-radius: var(--r-lg); backdrop-filter: blur(8px); flex-wrap: wrap; align-items: center;">
      <div style="font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;">Legenda das Etapas:</div>`;
    Object.entries(CATEGORY_COLORS).forEach(([stageName, color]) => {
      const borderColor = CATEGORY_BORDERS[stageName];
      html += `<div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-1); font-weight: 500;">
        <div style="width: 10px; height: 10px; background: ${color}; border: 1px solid ${borderColor}; border-radius: 3px; box-shadow: 0 0 6px ${borderColor}60;"></div>
        <span>${stageName}</span>
      </div>`;
    });
    html += `</div>`;

    html += `<div style="display: flex; align-items: center; margin-bottom: 2px;">
      <div style="width: ${LABEL_WIDTH}px;"></div>
      <div style="display: flex; width: ${TIMELINE_WIDTH}px; height: 18px; border-radius: 4px; overflow: hidden; border: 1px solid var(--card-border);">`;
    QUARTERS.forEach(q => {
      const width = (q.end - q.start) * MONTH_WIDTH;
      html += `<div style="width: ${width}px; background: ${q.color}; display: flex; align-items: center; justify-content: center; color: var(--ink-2); font-weight: 700; font-size: 9px;">${q.label}</div>`;
    });
    html += `</div>
      <div style="width: 120px; font-size: 9px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; text-align: left; padding-left: 14px;">Público Alvo</div>
      <div style="width: 90px; font-size: 9px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; text-align: center;">Squad</div>
    </div>`;

    html += `<div style="display: flex; align-items: center; margin-bottom: 8px;">
      <div style="width: ${LABEL_WIDTH}px;"></div>
      <div style="display: flex; width: ${TIMELINE_WIDTH}px;">`;
    MONTHS.forEach(month => {
      html += `<div style="width: ${MONTH_WIDTH}px; text-align: center; font-size: 8px; color: var(--ink-3); font-weight: 600; padding: 1px 0;">${month}</div>`;
    });
    html += `</div><div style="width: 120px;"></div><div style="width: 90px;"></div></div>`;

    const todayLeft = LABEL_WIDTH + TODAY_POS * MONTH_WIDTH;
    html += `
      <div style="position: absolute; left: ${todayLeft}px; top: 40px; bottom: 0; width: 1.5px; background: #00fff2; z-index: 5; box-shadow: 0 0 8px rgba(0,255,242,0.6);">
        <div style="position: absolute; top: 24px; left: 50%; transform: translateX(-50%); background: #00fff2; color: #171e3d; padding: 1px 5px; border-radius: 2px; font-size: 8px; font-weight: 700; white-space: nowrap;">Hoje</div>
      </div>
    `;

    filtered.forEach(p => {
      // ATUALIZADO: SQUAD TRAZ TODOS RESPEITANDO A ORDEM OWNER -> COOWNER -> HRBP
      const avOwner = generateTimelineAvatarHtml(p.owner, 20);
      const avCoOwner = generateTimelineAvatarHtml(p.coOwner, 20);
      const avHrbp = generateTimelineAvatarHtml(p.hrbp, 20);
      const avatarWrapperHtml = `<div style="display: flex; gap: 3px; align-items: center; justify-content: center; width: 90px;">${avOwner}${avCoOwner}${avHrbp}</div>`;

      html += `<div style="display: flex; border-bottom: 1px solid rgba(120, 180, 255, 0.05); padding: 10px 0; align-items: center;">
        <div style="width: ${LABEL_WIDTH}px; padding-right: 8px; font-size: 10px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 8px;">
          ${p.iface ? `<img src="${p.iface}" alt="" style="width: 22px; height: 22px; border-radius: 5px; object-fit: contain; background: rgba(255,255,255,0.05); padding: 2px; flex-shrink: 0;" />` : `<div style="width: 22px; height: 22px; flex-shrink:0;"></div>`}
          <span style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px;" title="${p.name}">${p.name}</span>
        </div>
        <div style="position: relative; width: ${TIMELINE_WIDTH}px; height: 26px; background: rgba(255,255,255,0.01); border-radius: 4px; margin-left: 12px; display: flex; align-items: center;">`;

      const stageEntries = Object.entries(p.stages || {});
      stageEntries.forEach(([stageName, stageData]) => {
        const startPos = dueToPos(stageData.startStr);
        const endPos = dueToPos(stageData.endStr);
        const leftPx = startPos * MONTH_WIDTH;
        const widthPx = (endPos - startPos) * MONTH_WIDTH;

        if (widthPx > 0) {
          const catColor = CATEGORY_COLORS[stageName] || 'rgba(75, 163, 255, 0.55)';
          const borderColor = CATEGORY_BORDERS[stageName] || 'var(--neon-blue)';
          const textColor = CATEGORY_TEXT[stageName] || '#ffffff';

          html += `
            <div style="position: absolute; left: ${leftPx}px; width: ${widthPx}px; height: 20px; top: 3px; background: ${catColor}; border: 1px solid ${borderColor}; backdrop-filter: blur(4px); border-radius: 4px; display: flex; align-items: center; justify-content: flex-end; padding: 0 6px; color: ${textColor}; font-size: 8px; font-weight: 700; box-shadow: 0 0 8px ${borderColor}40, inset 0 0 6px rgba(255,255,255,0.1); cursor: pointer; overflow: hidden;" onclick="openTimelineEditModal('${p.id}', '${stageName}')"></div>
            <div style="position: absolute; left: ${leftPx}px; top: 25px; font-size: 7px; color: var(--ink-4); white-space: nowrap; font-weight: 500;">${stageData.startStr}</div>
            <div style="position: absolute; left: ${leftPx + widthPx}px; top: 25px; transform: translateX(-100%); font-size: 7px; color: var(--ink-4); white-space: nowrap; font-weight: 500;">${stageData.endStr}</div>
          `;
        }
      });

      html += `</div>
        <div style="width: 120px; padding-left: 14px; font-size: 10px; font-weight: 600; color: var(--ink-3); line-height: 1.2; white-space: normal; word-break: break-word;">${p.impacted || 'Não informado'}</div>
        ${avatarWrapperHtml}
      </div>`;
    });
    html += `</div>`;
    return html;

  } else {
    // ==========================================
    // CONFIGURAÇÃO MODO KPIS (SEM COLUNA TARGET)
    // ==========================================
    const PROJ_WIDTH = 150;
    const METRIC_WIDTH = 220; 
    const VAL_WIDTH = 65;
    const KPI_COLS = ['Baseline', 'Mai', 'Jun', 'Jul', 'Ago', 'Set']; // ATUALIZADO: Removido 'Target' das colunas
    const TOTAL_VALS_WIDTH = KPI_COLS.length * VAL_WIDTH;

    let html = `<div style="position: relative;">`;
    html += `<div style="margin-top: 15px;"></div>`;
    html += `<div style="display: flex; align-items: center; margin-bottom: 8px; border-bottom: 1px solid var(--card-border); padding-bottom: 6px;">
      <div style="width: ${PROJ_WIDTH}px; font-size: 9px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em;">Projeto</div>
      <div style="width: ${METRIC_WIDTH}px; font-size: 9px; font-weight: 700; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 0.08em; padding-left: 10px;">Métrica</div>
      <div style="display: flex; width: ${TOTAL_VALS_WIDTH}px;">`;
    KPI_COLS.forEach(col => {
      html += `<div style="width: ${VAL_WIDTH}px; text-align: center; font-size: 9px; color: var(--neon-blue); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;">${col}</div>`;
    });
    html += `</div>
      <div style="width: 100px; font-size: 9px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; padding-left: 14px;">Público Alvo</div>
      <div style="width: 90px; font-size: 9px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; text-align: center;">Squad</div>
    </div>`;

    filtered.forEach(p => {
      const metricList = p.metrics || [{ name: 'Sem métricas associadas', baseline: '-', mai: '-', jun: '-', jul: '-', ago: '-', set: '-' }];
      const avOwner = generateTimelineAvatarHtml(p.owner, 20);
      const avCoOwner = generateTimelineAvatarHtml(p.coOwner, 20);
      const avHrbp = generateTimelineAvatarHtml(p.hrbp, 20);
      const avatarWrapperHtml = `<div style="display: flex; gap: 3px; align-items: center; justify-content: center; width: 90px;">${avOwner}${avCoOwner}${avHrbp}</div>`;

      metricList.forEach((m, idx) => {
        html += `<div style="display: flex; border-bottom: 1px solid rgba(120, 180, 255, 0.05); padding: 8px 0; align-items: center; min-height: 38px;">`;
        
        if (idx === 0) {
          html += `<div style="width: ${PROJ_WIDTH}px; padding-right: 8px; font-size: 10px; font-weight: 700; color: var(--ink-1); display: flex; align-items: center; gap: 6px;">
            ${p.iface ? `<img src="${p.iface}" alt="" style="width: 18px; height: 18px; border-radius: 4px; object-fit: contain; background: rgba(255,255,255,0.05); padding: 1px;" />` : ''}
            <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${p.name}">${p.name}</span>
          </div>`;
        } else {
          html += `<div style="width: ${PROJ_WIDTH}px;"></div>`;
        }

        html += `<div style="width: ${METRIC_WIDTH}px; font-size: 10px; font-weight: 500; color: var(--ink-2); padding-left: 10px; padding-right: 10px; white-space: normal; word-break: break-word; line-height: 1.3; display: flex; align-items: center; gap: 6px;">
          <span>${m.name}</span>${m.info ? `<span style="font-size: 10px; color: var(--neon-blue); cursor: help;" title="${m.info}">&#9432;</span>` : ''}
        </div>`;

        html += `<div style="display: flex; width: ${TOTAL_VALS_WIDTH}px;">`;
        const keys = ['baseline', 'mai', 'jun', 'jul', 'ago', 'set']; // ATUALIZADO: Chave 'target' expurgada do loop
        keys.forEach(k => {
          const val = m[k] || '-';
          const isFilled = val !== '-';
          let txtColor = 'var(--ink-1)';
          if (k === 'baseline') txtColor = 'var(--ink-3)';
          if (!isFilled) txtColor = 'var(--ink-4)';

          html += `<div style="width: ${VAL_WIDTH}px; text-align: center; font-size: 10px; font-weight: 600; color: ${txtColor};">${val}</div>`;
        });
        html += `</div>`;

        if (idx === 0) {
          html += `
            <div style="width: 100px; padding-left: 14px; font-size: 10px; font-weight: 600; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${p.impacted || 'Não informado'}">${p.impacted || 'Não informado'}</div>
            ${avatarWrapperHtml}
          `;
        } else {
          html += `<div style="width: 100px;"></div><div style="width: 90px;"></div>`;
        }

        html += `</div>`;
      });
    });
    html += `</div>`;
    return html;
  }
}

  document.getElementById('project-modal').classList.add('active');

function closeModal() { document.getElementById('project-modal').classList.remove('active'); }

function openTimelineEditModal(id, initialStage = 'Desenvolvimento') {
  editingProjectId = id;
  const project = PROJECTS.find(p => p.id === id);
  if (!project) return;
  
  document.getElementById('timeline-project-info').textContent = `Projeto: ${project.name}`;
  document.getElementById('timeline-stage-select').value = initialStage;
  
  loadStageDatesData(); 
  document.getElementById('timeline-edit-modal').classList.add('active');
}

function loadStageDatesData() {
  const project = PROJECTS.find(p => p.id === editingProjectId);
  if (!project) return;
  
  const selectedStage = document.getElementById('timeline-stage-select').value;
  
  if (project.stages && project.stages[selectedStage]) {
    document.getElementById('timeline-start').value = project.stages[selectedStage].startStr;
    document.getElementById('timeline-end').value = project.stages[selectedStage].endStr;
    document.getElementById('timeline-progress').value = project.stages[selectedStage].progress;
  } else {
    document.getElementById('timeline-start').value = '';
    document.getElementById('timeline-end').value = '';
    document.getElementById('timeline-progress').value = '0';
  }
}

const closeTimelineEditModal = () => {
  document.getElementById('timeline-edit-modal').classList.remove('active');
  editingProjectId = null;
}

document.getElementById('project-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const ownerId = document.getElementById('form-owner').value;
  const owner = Object.values(TEAM).find(t => t.id === ownerId);
  const cat = document.getElementById('form-category').value;
  const prog = parseInt(document.getElementById('form-progress').value);
  const due = document.getElementById('form-due').value;

  if (editingId) {
    const p = PROJECTS.find(p => p.id === editingId);
    p.name = document.getElementById('form-name').value;
    p.sub = document.getElementById('form-sub').value;
    p.status = document.getElementById('form-status').value;
    p.category = cat; p.progress = prog; p.due = due; p.owner = owner;
    if(!p.stages) p.stages = {};
    if(p.stages[cat]) {
      p.stages[cat].progress = prog;
      p.stages[cat].endStr = due;
    } else {
      p.stages[cat] = { startStr: '10 abr', endStr: due, progress: prog };
    }
  } else {
    const newProj = {
      id: 'p' + Date.now(),
      name: document.getElementById('form-name').value,
      sub: document.getElementById('form-sub').value,
      icon: '📌', status: document.getElementById('form-status').value,
      category: cat, progress: prog, owner: owner, due: due, stages: {}, metrics: [{ name: 'Nova Métrica', baseline: '-', mai: '-', jun: '-', jul: '-', ago: '-', set: '-' }]
    };
    newProj.stages[cat] = { startStr: '10 abr', endStr: due, progress: prog };
    PROJECTS.push(newProj);
  }
  closeModal();
  applyDashboardFilters();
  renderStats();
});

document.getElementById('timeline-edit-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const project = PROJECTS.find(p => p.id === editingProjectId);
  if (!project) return;
  
  const selectedStage = document.getElementById('timeline-stage-select').value;
  const startStr = document.getElementById('timeline-start').value;
  const endStr = document.getElementById('timeline-end').value;
  const progress = parseInt(document.getElementById('timeline-progress').value);
  
  if (!project.stages) project.stages = {};
  
  project.stages[selectedStage] = {
    startStr: startStr,
    endStr: endStr,
    progress: progress
  };

  if (project.category === selectedStage) {
    project.progress = progress;
    project.due = endStr;
  }
  
  closeTimelineEditModal();
  applyDashboardFilters();
  renderStats();
});

function getFilteredProjects() {
  const stageFilter = document.getElementById('filter-status').value;
  return PROJECTS.filter(p => !stageFilter || p.category === stageFilter);
}

function applyDashboardFilters() {
  const dateSort = document.getElementById('filter-date').value;
  let filtered = getFilteredProjects();
  
  if (dateSort === 'start-asc') {
    filtered.sort((a, b) => dueToPos(a.stages[a.category]?.startStr || '') - dueToPos(b.stages[b.category]?.startStr || ''));
  } else if (dateSort === 'start-desc') {
    filtered.sort((a, b) => dueToPos(b.stages[b.category]?.startStr || '') - dueToPos(a.stages[a.category]?.startStr || ''));
  } else if (dateSort === 'end-asc') {
    filtered.sort((a, b) => dueToPos(a.due) - dueToPos(b.due));
  } else if (dateSort === 'end-desc') {
    filtered.sort((a, b) => dueToPos(b.due) - dueToPos(a.due));
  } else if (dateSort === 'interface-asc') {
    filtered.sort((a, b) => {
      const compIface = (a.iface || '').localeCompare(b.iface || '');
      if (compIface !== 0) return compIface;
      return (a.owner?.name || '').localeCompare(b.owner?.name || '');
    });
  } else if (dateSort === 'owner-asc') {
    filtered.sort((a, b) => {
      const compOwner = (a.owner?.name || '').localeCompare(b.owner?.name || '');
      if (compOwner !== 0) return compOwner;
      return (a.iface || '').localeCompare(b.iface || '');
    });
  }
  
  renderProjects(filtered);
}

let currentTimelineSort = 'start'; 
function sortTimeline(type) {
  currentTimelineSort = type;
  
  document.querySelectorAll('#tab-timeline .timeline-sort-btn').forEach(btn => btn.classList.remove('active'));
  if (type === 'start') document.getElementById('sort-timeline-start').classList.add('active');
  if (type === 'owner') document.getElementById('sort-timeline-owner').classList.add('active');
  if (type === 'infra') document.getElementById('sort-timeline-infra').classList.add('active');
  if (type === 'impact') document.getElementById('sort-timeline-impact').classList.add('active');
  
  let filtered = [...getFilteredProjects()];
  
  if (type === 'start') {
    // ATUALIZADO: FILTRADO E ORDENADO CRESCENTE PELA DATA DOS TESTES INTERNOS (SÓ SE A ETAPA EXISTIR)
    filtered.sort((a, b) => {
      const dateA = a.stages['Testes Internos']?.startStr || '30 set';
      const dateB = b.stages['Testes Internos']?.startStr || '30 set';
      return dueToPos(dateA) - dueToPos(dateB);
    });
  } else if (type === 'owner') {
    filtered.sort((a, b) => {
      const compOwner = (a.owner?.name || '').localeCompare(b.owner?.name || '');
      if (compOwner !== 0) return compOwner;
      return (a.iface || '').localeCompare(b.iface || '');
    });
  } else if (type === 'infra') {
    filtered.sort((a, b) => {
      const compIface = (a.iface || '').localeCompare(b.iface || '');
      if (compIface !== 0) return compIface;
      return (a.owner?.name || '').localeCompare(b.owner?.name || '');
    });
  } else if (type === 'impact') {
    filtered.sort((a, b) => {
      const compImpact = (a.impacted || '').localeCompare(b.impacted || '');
      if (compImpact !== 0) return compImpact;
      return (a.name || '').localeCompare(b.name || '');
    });
  }
  
  renderTimeline(filtered);
}
