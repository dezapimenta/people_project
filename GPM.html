<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>GPM — Gestão de Projetos Neon</title>
<link rel="stylesheet" href="gpm.css" />
<style>
  html, body { margin: 0; height: 100%; background: #0f1530; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0f1530; }
  .frame { width: 1440px; height: 900px; transform-origin: center center; background: var(--surface-2); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div class="stage"><div class="frame" id="frame"><div id="root" style="height:100%"></div></div></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
      <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#008fff"/>
        <stop offset="1" stop-color="#00fff2"/>
      </linearGradient>
    </defs>
    <rect width="200" height="200" rx="36" fill="#0f1530"/>
    <rect x="60" y="60" width="80" height="80" rx="22" fill="url(#g)"/>
    <text x="100" y="118" font-family="DM Sans, system-ui, sans-serif" font-weight="700" font-size="44" text-anchor="middle" fill="#0f1530" letter-spacing="-1">G</text>
  </svg>
</template>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script>
  // Scale the 1440x900 canvas to fit viewport
  (function () {
    const frame = document.getElementById('frame');
    function fit() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const s = Math.min(w / 1440, h / 900, 1);
      frame.style.transform = `scale(${s})`;
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
